name: Build and Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-build
            build_cmd: yarn production:build_osx
            artifact_path: |
              dist/electron/Packaged/**/*.dmg
              dist/electron/Packaged/**/*.zip
              dist/electron/Packaged/**/*.yml
              dist/electron/Packaged/**/*.blockmap
          - os: windows-latest
            artifact_name: windows-build
            build_cmd: yarn production:build_win
            artifact_path: |
              dist/electron/Packaged/**/*.exe
              dist/electron/Packaged/**/*.yml
              dist/electron/Packaged/**/*.blockmap

    runs-on: ${{ matrix.os }}

    env:
      # CI 打包默认关闭自动签名，避免因为缺失证书导致构建失败
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Set execute permissions for bundled FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x src-electron/bin/ffmpeg-aarch64-apple-darwin
          chmod +x src-electron/bin/ffprobe-aarch64-apple-darwin

      - name: Build Electron package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Show packaged files
        shell: bash
        run: |
          if [ -d "dist/electron/Packaged" ]; then
            find dist/electron/Packaged -maxdepth 3 -type f | sort
          else
            echo "dist/electron/Packaged not found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          merge-multiple: true
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.yml
            release-artifacts/**/*.blockmap
