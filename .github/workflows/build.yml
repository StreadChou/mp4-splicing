name: Build and Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：用于手动构建时同步版本号（示例：v0.2.8）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-build
            build_cmd: yarn production:build_osx
            artifact_path: |
              dist/electron/Packaged/**/*.dmg
              dist/electron/Packaged/**/*.zip
              dist/electron/Packaged/**/*.yml
              dist/electron/Packaged/**/*.blockmap
          - os: windows-latest
            artifact_name: windows-build
            build_cmd: yarn production:build_win
            artifact_path: |
              dist/electron/Packaged/**/*.exe
              dist/electron/Packaged/**/*.yml
              dist/electron/Packaged/**/*.blockmap

    runs-on: ${{ matrix.os }}

    env:
      # CI 打包默认关闭自动签名，避免因为缺失证书导致构建失败
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Resolve app version
        shell: bash
        run: |
          raw_tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            raw_tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            raw_tag="${{ inputs.release_tag }}"
          fi

          if [ -z "$raw_tag" ]; then
            app_version="$(node -p "require('./package.json').version")"
          else
            if [[ "$raw_tag" != v* ]]; then
              echo "::error::release_tag 必须以 v 开头，例如 v0.2.8"
              exit 1
            fi
            app_version="${raw_tag#v}"
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$raw_tag" >> "$GITHUB_ENV"
          echo "Using version: $app_version"

      - name: Sync package.json version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.APP_VERSION;fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          echo "package.json version => $(node -p "require('./package.json').version")"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Set execute permissions for bundled FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x src-electron/bin/ffmpeg-aarch64-apple-darwin
          chmod +x src-electron/bin/ffprobe-aarch64-apple-darwin

      - name: Prepare dmgbuild bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -L --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/dmgbuild-bundle.tar.gz" "https://github.com/electron-userland/electron-builder-binaries/releases/download/dmg-builder%401.2.0/dmgbuild-bundle-arm64-75c8a6c.tar.gz"
          mkdir -p "$RUNNER_TEMP/dmgbuild"
          tar -xzf "$RUNNER_TEMP/dmgbuild-bundle.tar.gz" -C "$RUNNER_TEMP/dmgbuild"
          echo "CUSTOM_DMGBUILD_PATH=$RUNNER_TEMP/dmgbuild/dmgbuild" >> "$GITHUB_ENV"

      - name: Build Electron package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Show packaged files
        shell: bash
        run: |
          if [ -d "dist/electron/Packaged" ]; then
            find dist/electron/Packaged -maxdepth 3 -type f | sort
          else
            echo "dist/electron/Packaged not found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ env.APP_VERSION }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build-*"
          merge-multiple: true
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/latest.yml
            release-artifacts/**/latest-mac.yml
            release-artifacts/**/*.dmg.blockmap
            release-artifacts/**/*.exe.blockmap
